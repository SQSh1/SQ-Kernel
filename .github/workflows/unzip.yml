name: Unzip Files and Push to Repository

on:
  workflow_dispatch:

jobs:
  unzip:
    name: Unzip Files
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install unzip
      run: |
        sudo apt update
        sudo apt install unzip

    - name: List files in repo
      run: |
        ls -lh

    - name: Unzip KernelSU-main.zip
      run: |
        unzip KernelSU-main.zip -d KernelSU || { echo "Failed to unzip KernelSU-main.zip"; exit 1; }

    - name: Unzip AnyKernel3-master.zip
      run: |
        unzip AnyKernel3-master.zip -d AnyKernel3 || { echo "Failed to unzip AnyKernel3-master.zip"; exit 1; }

    - name: List extracted files
      run: |
        ls -lh KernelSU
        ls -lh KernelSU/KernelSU-main
        ls -lh AnyKernel3

    - name: Commit and push extracted files
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add KernelSU AnyKernel3
        git commit -m "Add extracted KernelSU and AnyKernel3 files"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
